name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcgi-pm-perl \
            libcrypt-argon2-perl \
            libcrypt-urandom-perl \
            libwww-perl

      - name: Run test suite
        run: prove -lr t
