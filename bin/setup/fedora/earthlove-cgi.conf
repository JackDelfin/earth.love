# earthlove-cgi.conf - earth.love CGI configuration for Fedora / RHEL Apache
# Installed to /etc/httpd/conf.d/earthlove-cgi.conf by el_setup_BASE_fedora.sh
#
# The earth.love Orbit programs are served from /o/ instead of /cgi-bin/
# (On Debian this is done by editing serve-cgi-bin.conf; on Fedora the
#  cgi-bin ScriptAlias lives in httpd.conf, so /o/ is added here.)
#
# mod_cgid (threaded MPM) / mod_cgi (prefork) is loaded by the standard
# httpd package via /etc/httpd/conf.modules.d/01-cgi.conf

ScriptAlias /o/ "/var/www/cgi-bin/"

# Retired CGI aliases.  308 keeps POST bodies on elnew7/eladd7/…
RedirectMatch 308 "^/o/(elshow|elshow7|showpage|showpage7|page7|o7)(\.pl)?$" "/o/page"
RedirectMatch 308 "^/o/o(\.pl)?$" "/o/page"
RedirectMatch 308 "^/o/elnew7(\.pl)?$" "/o/elnew"
RedirectMatch 308 "^/o/eladd7(\.pl)?$" "/o/eladd"
RedirectMatch 308 "^/o/eledit7(\.pl)?$" "/o/eledit"
RedirectMatch 308 "^/o/eldel7(\.pl)?$" "/o/eldel"

<Directory "/var/www/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>
