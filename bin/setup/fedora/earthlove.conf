# earthlove.conf - earth.love base configuration for Fedora / RHEL Apache
# Installed to /etc/httpd/conf.d/earthlove.conf by el_setup_BASE_fedora.sh
#
# Gives Fedora httpd the same sites-available / sites-enabled and
# conf-available / conf-enabled behavior as Debian apache2, so the
# earth.love domain tools (elSETUP_DOM.pl, RMSITE.pl, qsite, sites, ...)
# work without changes.

ServerName earth.love

# Easier to process the _LOGS (matches the Debian apache2.conf setting)
HostnameLookups Off

# Virtual Hosts enabled with a2ensite (Debian style)
IncludeOptional /etc/httpd/sites-enabled/*.conf

# Additional configs enabled with a2enconf (Debian style)
IncludeOptional /etc/httpd/conf-enabled/*.conf
