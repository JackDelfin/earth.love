<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerAdmin admin@earth.love
ServerName #DOMAIN#
ServerAlias www.#DOMAIN#
DocumentRoot #DOMGROUP##DOMAINROOT#/_WEB
<Directory #DOMGROUP##DOMAINROOT#/_WEB/>
  Options Indexes FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>
Include /etc/apache2/elRewrite.conf
#ErrorLog #DOMGROUP##DOMAINROOT#/_LOGS/error.log
#CustomLog #DOMGROUP##DOMAINROOT#/_LOGS/access.log combined "expr=(-z reqenv('hacklog') && -z reqenv('botlog'))"
#CustomLog #DOMGROUP##DOMAINROOT#/_LOGS/accessHACK.log combined env=hacklog
#CustomLog #DOMGROUP##DOMAINROOT#/_LOGS/accessBOT.log combined env=botlog

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/#DOMAIN#/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/#DOMAIN#/privkey.pem
</VirtualHost>
</IfModule>
