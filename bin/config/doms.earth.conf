<VirtualHost *:80>
ServerAdmin admin@earth.love
ServerName DOMS.earth
ServerAlias www.DOMS.earth
DocumentRoot /LOVE/EARTH/DOMS.earth/_WEB
<Directory /LOVE/EARTH/DOMS.earth/_WEB/>
  Options Indexes FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>
Include /etc/apache2/elRewrite.conf
ErrorLog /LOVE/EARTH/DOMS.earth/_LOGS/error.log
CustomLog /LOVE/EARTH/DOMS.earth/_LOGS/access.log combined "expr=(-z reqenv('hacklog') && -z reqenv('botlog'))"
CustomLog /LOVE/EARTH/DOMS.earth/_LOGS/accessHACK.log combined env=hacklog
CustomLog /LOVE/EARTH/DOMS.earth/_LOGS/accessBOT.log combined env=botlog
</VirtualHost>
