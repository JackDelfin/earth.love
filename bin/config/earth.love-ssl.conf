<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerAdmin admin@earth.love
ServerName earth.love
ServerAlias www.earth.love
DocumentRoot /LOVE/earth.love/_WEB
<Directory /LOVE/earth.love/_WEB/>
  Options Indexes FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>
Include /etc/apache2/elRewrite.conf
ErrorLog /LOVE/earth.love/_LOGS/error.log
CustomLog /LOVE/earth.love/_LOGS/access.log combined "expr=(-z reqenv('hacklog') && -z reqenv('botlog'))"
CustomLog /LOVE/earth.love/_LOGS/accessHACK.log combined env=hacklog
CustomLog /LOVE/earth.love/_LOGS/accessBOT.log combined env=botlog

# Local/dev TLS: Fedora httpd-init self-signed cert.
# Replace with Let's Encrypt via elSETUP_DOM.pl for public domains.
Include /etc/letsencrypt/options-ssl-apache.conf
SSLEngine on
SSLCertificateFile /etc/pki/tls/certs/localhost.crt
SSLCertificateKeyFile /etc/pki/tls/private/localhost.key
</VirtualHost>
</IfModule>
