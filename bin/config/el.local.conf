<VirtualHost *:80>
ServerAdmin webmaster@localhost
ServerName el.local
ServerAlias localhost
DocumentRoot /LOVE/earth.love/_WEB
<Directory /LOVE/earth.love/_WEB/>
  Options Indexes FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>
Include /etc/apache2/elRewrite.conf
ErrorLog /LOVE/earth.love/_LOGS/error.log
CustomLog /LOVE/earth.love/_LOGS/access.log combined "expr=(-z reqenv('hacklog') && -z reqenv('botlog'))"
CustomLog /LOVE/earth.love/_LOGS/accessHACK.log combined env=hacklog
CustomLog /LOVE/earth.love/_LOGS/accessBOT.log combined env=botlog
</VirtualHost>
